name: moneymate
description: "MoneyMate — an offline-first, Material You spending tracker for India."
publish_to: "none"

# 1:1 feature port of dev.hemanths.paisa (Spending Tracker – Paisa).
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # CardThemeData / DialogThemeData + ColorScheme surface containers are
  # required by the design system, so Flutter 3.27 (stable) or newer is needed.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local offline storage (manual TypeAdapter-free Map serialization).
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management.
  provider: ^6.1.2

  # Charts.
  fl_chart: ^0.68.0

  # Material You dynamic color.
  dynamic_color: ^1.7.0

  # Typography.
  google_fonts: ^6.2.1

  # Localization / number & date formatting.
  # NOTE: pinned as a compatible range instead of ^0.19.0 because
  # flutter_localizations (Flutter 3.29+) pins intl 0.20.x, and ^0.19.0 would
  # make `flutter pub get` fail on current stable toolchains.
  intl: ">=0.19.0 <0.21.0"

  # Ids.
  uuid: ^4.4.0

  # Lightweight key/value prefs (biometric lock + misc flags).
  shared_preferences: ^2.2.3

  # App lock.
  local_auth: ^2.2.0

  # File system access for backup / restore.
  path_provider: ^2.1.3

  # Export & share backups.
  share_plus: ^9.0.0

  # Import backups.
  file_picker: ^8.0.3

  # Micro-interactions.
  animations: ^2.0.11

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
