name: Release APK + Web + Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_download:
        description: 'Publish a direct release-mode APK download'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A stale older run must not hold a newer APK behind its concurrency lock.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    name: Analyze, test and package source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Check Dart formatting without modifying source
        id: dart-format
        continue-on-error: true
        run: python3 .github/scripts/checked_command.py dart format --output=none --set-exit-if-changed lib test
      - name: SDK formatting diagnostics (temporary copy only)
        if: ${{ steps.dart-format.outcome == 'failure' }}
        run: python3 .github/scripts/dart_format_diagnostic.py
      - run: python3 .github/scripts/checked_command.py flutter analyze --no-fatal-infos
      - run: python3 .github/scripts/checked_command.py flutter test
      - name: Calendar regressions across a DST boundary
        env:
          TZ: America/New_York
        run: python3 .github/scripts/checked_command.py flutter test test/regression_test.dart test/financial_pulse_calendar_test.dart
      - name: Offline web packaging regression tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Enforce the strict non-mutating format gate
        if: ${{ always() && steps.dart-format.outcome != 'success' }}
        run: exit 1
      - name: Package source for download
        run: git archive --format=zip --prefix=Tink/ HEAD -o Tink-source.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-source
          path: Tink-source.zip
          if-no-files-found: error
          retention-days: 30

  release:
    # Harness-only verification reuses the already-verified application binary.
    if: ${{ !contains(github.event.head_commit.message, '[web-check]') }}
    name: Release Android APK
    permissions:
      contents: write
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Prepare recommended Android NDK (retry downloads)
        run: python3 .github/scripts/checked_command.py bash .github/scripts/prepare_android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Optional persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo 'No signing secrets: producing an installable DEBUG-KEY-SIGNED release APK. See README before distributing.'
          fi
      - run: python3 .github/scripts/checked_command.py python3 .github/scripts/retry_build.py flutter build apk --release
      - name: Verify APK branding, version, native payload, signature and offline permissions
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/verify_apk.py build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct release APK (explicit opt-in)
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_download) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-download]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .github/scripts/checked_command.py python3 .github/scripts/publish_apk.py build/app/outputs/flutter-apk/app-release.apk "apk-release-${GITHUB_RUN_ID}" "$GITHUB_SHA"

  web:
    name: Self-hosted web + real-browser offline smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Web build (self-hosted renderer; no runtime CDN)
        run: |
          python3 .github/scripts/checked_command.py flutter build web --release --no-web-resources-cdn
          python3 scripts/create_web_cache.py
      - name: Install headless browser test tools
        run: npm install --prefix /tmp/paisa-web-smoke playwright-core @sparticuz/chromium pngjs
      - name: Browser onboarding, persistence and offline reload
        run: python3 .github/scripts/checked_command.py node .github/scripts/web_smoke.cjs
      - name: Visual evidence — failure (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-failure.jpg" "batch1-failure"
          python3 .github/scripts/image_diagnostic.py 1 "web-failure.jpg" "batch1-failure"
      - name: Visual evidence — intro (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-intro.jpg" "batch1-intro"
          python3 .github/scripts/image_diagnostic.py 1 "web-intro.jpg" "batch1-intro"
      - name: Visual evidence — budget-tour (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-budget-tour.jpg" "batch1-budget-tour"
          python3 .github/scripts/image_diagnostic.py 1 "web-budget-tour.jpg" "batch1-budget-tour"
      - name: Visual evidence — languages (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-languages.jpg" "batch1-languages"
          python3 .github/scripts/image_diagnostic.py 1 "web-languages.jpg" "batch1-languages"
      - name: Visual evidence — dashboard (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-dashboard.jpg" "batch1-dashboard"
          python3 .github/scripts/image_diagnostic.py 1 "web-dashboard.jpg" "batch1-dashboard"
      - name: Visual evidence — home-lower (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-home-lower.jpg" "batch1-home-lower"
          python3 .github/scripts/image_diagnostic.py 1 "web-home-lower.jpg" "batch1-home-lower"
      - name: Visual evidence — recurring (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-recurring.jpg" "batch1-recurring"
          python3 .github/scripts/image_diagnostic.py 1 "web-recurring.jpg" "batch1-recurring"
      - name: Visual evidence — calendar (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-calendar.jpg" "batch1-calendar"
          python3 .github/scripts/image_diagnostic.py 1 "web-calendar.jpg" "batch1-calendar"
      - name: Visual evidence — detail (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-detail.jpg" "batch1-detail"
          python3 .github/scripts/image_diagnostic.py 1 "web-detail.jpg" "batch1-detail"
      - name: Visual evidence — history (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-history.jpg" "batch1-history"
          python3 .github/scripts/image_diagnostic.py 1 "web-history.jpg" "batch1-history"
      - name: Visual evidence — help (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-help.jpg" "batch1-help"
          python3 .github/scripts/image_diagnostic.py 1 "web-help.jpg" "batch1-help"
      - name: Visual evidence — help-bottom (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-help-bottom.jpg" "batch1-help-bottom"
          python3 .github/scripts/image_diagnostic.py 1 "web-help-bottom.jpg" "batch1-help-bottom"
      - name: Visual evidence — archived (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-archived.jpg" "batch1-archived"
          python3 .github/scripts/image_diagnostic.py 1 "web-archived.jpg" "batch1-archived"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Tink-Web-screenshots
          path: web-*.jpg
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
