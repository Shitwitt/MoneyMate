name: paisaclone
description: A private, offline-first personal finance companion. No accounts, no servers, just your money.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # Must match the version pinned by flutter_localizations.
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.71.0
  dynamic_color: ^1.7.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  cross_file: ^0.3.4+2
  share_plus: ^10.1.4
  archive: ^4.6.0
  pdf: ^3.13.1
  printing: ^5.15.1
  app_links: ^6.4.0
  home_widget: ^0.8.0
  shimmer: ^3.0.0
  confetti: ^0.8.0
  math_expressions: ^2.6.0
  uuid: ^4.5.1
  csv: ^6.0.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/templates/
    - assets/fonts/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Regular.ttf
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
