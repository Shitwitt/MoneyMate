name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/**', 'main']
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Gradle 8.2.1 / AGP 8.2.1 are supported on JDK 17 (not 21).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships a full Android SDK; only the
      # platform/build-tools we need are ensured here.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(dirname "$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")")/sdkmanager"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          "$SDKMANAGER" --list_installed | head -30

      - name: Install dependencies
        run: npm ci

      - name: Run engine + live-state + onboarding tests
        run: npm test

      - name: Run onboarding SSR smoke
        run: npm run test:onboarding

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Rename artifact
        if: success()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/MoneyMate-${GITHUB_SHA::7}-debug.apk"
          cp "out/MoneyMate-${GITHUB_SHA::7}-debug.apk" out/MoneyMate-latest.apk
          ls -lh out

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-debug-apk
          path: out/*.apk
          retention-days: 30

      # Keep a copy of the build log so failures are diagnosable.
      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 7
          if-no-files-found: ignore

      # Pushing to a branch in the same repo keeps the APK downloadable
      # from a plain URL (artifact downloads require a GitHub login).
      - name: Publish APK to apk-builds branch
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd out
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apk: ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/raw/apk-builds/MoneyMate-latest.apk" >> "$GITHUB_STEP_SUMMARY"
