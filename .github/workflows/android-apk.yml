name: GlassChat APK
on:
  workflow_dispatch:
  push:
    branches: [arena/71512f21-moneymate]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: |
          set +e
          bash ./gradlew assembleDebug --stacktrace > build-log.txt 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          import pathlib
          text = pathlib.Path('build-log.txt').read_text()
          lines = [line for line in text.splitlines() if line.startswith('e:') or (not line.startswith('> Task') and line.startswith('> ')) or line.startswith('* ') or 'daemon disappeared' in line]
          diagnostic = '\n'.join(lines) or text[-18000:]
          for start in range(0, len(diagnostic), 3500):
              print('::error::' + diagnostic[start:start+3500].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          PYCODE
          fi
          cat build-log.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: GlassChat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
