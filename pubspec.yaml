name: paisa
description: "A production-grade offline spending tracker with Material You theming and Hive persistence."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  fl_chart: ^0.68.0
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  file_picker: ^8.0.3
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Outfit is bundled locally so google_fonts never needs runtime network
  # fetching (and therefore never needs the INTERNET permission).
  assets:
    - assets/fonts/
