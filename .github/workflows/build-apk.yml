name: Release APK + Web + Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_download:
        description: 'Publish a direct release-mode APK download'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A stale older run must not hold a newer APK behind its concurrency lock.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    name: Analyze, test and package source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Check Dart formatting without modifying source
        id: dart-format
        continue-on-error: true
        run: python3 .github/scripts/checked_command.py dart format --output=none --set-exit-if-changed lib test
      - name: SDK formatting diagnostics (temporary copy only)
        if: ${{ steps.dart-format.outcome == 'failure' }}
        run: python3 .github/scripts/dart_format_diagnostic.py
      - run: python3 .github/scripts/checked_command.py flutter analyze --no-fatal-infos
      - run: python3 .github/scripts/checked_command.py flutter test
      - name: Calendar regressions across a DST boundary
        env:
          TZ: America/New_York
        run: python3 .github/scripts/checked_command.py flutter test test/regression_test.dart test/financial_pulse_calendar_test.dart test/reference_batch_03_data_test.dart test/reference_batch_04_data_test.dart
      - name: Offline web packaging regression tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Enforce the strict non-mutating format gate
        if: ${{ always() && steps.dart-format.outcome != 'success' }}
        run: exit 1
      - name: Require unchanged tracked source and dependency lock
        run: git diff --exit-code HEAD --
      - name: Package source for download
        run: git archive --format=zip --prefix=Tink/ HEAD -o Tink-source.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-source
          path: Tink-source.zip
          if-no-files-found: error
          retention-days: 30

  release:
    # Explicit opt-in only: the user requested UI work without APK builds.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]') || contains(github.event.head_commit.message, '[apk-download]')
    name: Release Android APK
    permissions:
      contents: write
    # Never publish ahead of the same-commit browser and complete frame gates.
    needs: [checks, web, web-review, batch3-review, batch4-review, review-2026]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Prepare recommended Android NDK (retry downloads)
        run: python3 .github/scripts/checked_command.py bash .github/scripts/prepare_android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Optional persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo 'No signing secrets: producing an installable DEBUG-KEY-SIGNED release APK. See README before distributing.'
          fi
      - run: python3 .github/scripts/checked_command.py python3 .github/scripts/retry_build.py flutter build apk --release
      - name: Verify APK branding, version, native payload, signature and offline permissions
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/verify_apk.py build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct release APK (explicit opt-in)
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_download) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-download]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .github/scripts/checked_command.py python3 .github/scripts/publish_apk.py build/app/outputs/flutter-apk/app-release.apk "apk-release-${GITHUB_RUN_ID}" "$GITHUB_SHA"

  web:
    name: Self-hosted web + real-browser offline smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Web build (self-hosted renderer; no runtime CDN)
        run: |
          python3 .github/scripts/checked_command.py flutter build web --release --no-web-resources-cdn
          python3 scripts/create_web_cache.py
      - name: Install headless browser test tools
        run: npm install --prefix /tmp/paisa-web-smoke playwright-core @sparticuz/chromium pngjs
      - name: Browser onboarding, persistence and offline reload
        run: python3 .github/scripts/checked_command.py node .github/scripts/web_smoke.cjs
      - name: Visual evidence — failure (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-failure.jpg" "batch2-failure"
          python3 .github/scripts/image_diagnostic.py 1 "web-failure.jpg" "batch2-failure"
      - name: Visual evidence — home-top (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-dashboard.jpg" "batch2-home-top"
          python3 .github/scripts/image_diagnostic.py 1 "web-dashboard.jpg" "batch2-home-top"
      - name: Visual evidence — home-grid (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-home-grid.jpg" "batch2-home-grid"
          python3 .github/scripts/image_diagnostic.py 1 "web-home-grid.jpg" "batch2-home-grid"
      - name: Visual evidence — home-heatmap (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-home-heatmap.jpg" "batch2-home-heatmap"
          python3 .github/scripts/image_diagnostic.py 1 "web-home-heatmap.jpg" "batch2-home-heatmap"
      - name: Visual evidence — home-trend (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-home-trend.jpg" "batch2-home-trend"
          python3 .github/scripts/image_diagnostic.py 1 "web-home-trend.jpg" "batch2-home-trend"
      - name: Visual evidence — home-budgets (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-home-budgets.jpg" "batch2-home-budgets"
          python3 .github/scripts/image_diagnostic.py 1 "web-home-budgets.jpg" "batch2-home-budgets"
      - name: Visual evidence — home-upcoming (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-home-upcoming.jpg" "batch2-home-upcoming"
          python3 .github/scripts/image_diagnostic.py 1 "web-home-upcoming.jpg" "batch2-home-upcoming"
      - name: Visual evidence — accounts (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-accounts.jpg" "batch2-accounts"
          python3 .github/scripts/image_diagnostic.py 1 "web-accounts.jpg" "batch2-accounts"
      - name: Visual evidence — reports (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-reports.jpg" "batch2-reports"
          python3 .github/scripts/image_diagnostic.py 1 "web-reports.jpg" "batch2-reports"
      - name: Visual evidence — report-charts (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-flow.jpg" "batch2-report-charts"
          python3 .github/scripts/image_diagnostic.py 1 "web-flow.jpg" "batch2-report-charts"
      - name: Visual evidence — budgets (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-budgets.jpg" "batch2-budgets"
          python3 .github/scripts/image_diagnostic.py 1 "web-budgets.jpg" "batch2-budgets"
      - name: Visual evidence — budget-detail (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-budget-detail.jpg" "batch2-budget-detail"
          python3 .github/scripts/image_diagnostic.py 1 "web-budget-detail.jpg" "batch2-budget-detail"
      - name: Visual evidence — budget-help (fictional data)
        if: always()
        run: |
          python3 .github/scripts/image_diagnostic.py 0 "web-budget-help-bottom.jpg" "batch2-budget-help"
          python3 .github/scripts/image_diagnostic.py 1 "web-budget-help-bottom.jpg" "batch2-budget-help"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Tink-Web-screenshots
          path: web-*.jpg
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  web-review:
    name: Additional reference captures (fictional data)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Separate review budget: at most 16 x 3 annotations, with no Flutter/native build.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Tink-Web-screenshots
          path: review-shots
      - name: Require every supplemental capture and thumbnail
        run: |
          test -s review-shots/web-home-tools.jpg && test -s review-shots/web-home-tools-thumb.jpg
          test -s review-shots/web-home-tools-more.jpg && test -s review-shots/web-home-tools-more-thumb.jpg
          test -s review-shots/web-home-templates.jpg && test -s review-shots/web-home-templates-thumb.jpg
          test -s review-shots/web-budget-status.jpg && test -s review-shots/web-budget-status-thumb.jpg
          test -s review-shots/web-budget-breakdown.jpg && test -s review-shots/web-budget-breakdown-thumb.jpg
          test -s review-shots/web-budget-help.jpg && test -s review-shots/web-budget-help-thumb.jpg
          test -s review-shots/web-accounts-second.jpg && test -s review-shots/web-accounts-second-thumb.jpg
          test -s review-shots/web-allocation.jpg && test -s review-shots/web-allocation-thumb.jpg
          test -s review-shots/web-report-line.jpg && test -s review-shots/web-report-line-thumb.jpg
          test -s review-shots/web-financial-month.jpg && test -s review-shots/web-financial-month-thumb.jpg
          test -s review-shots/web-financial-category.jpg && test -s review-shots/web-financial-category-thumb.jpg
          test -s review-shots/web-financial-budget.jpg && test -s review-shots/web-financial-budget-thumb.jpg
          test -s review-shots/web-financial-cashflow.jpg && test -s review-shots/web-financial-cashflow-thumb.jpg
          test -s review-shots/web-financial-goal.jpg && test -s review-shots/web-financial-goal-thumb.jpg
          test -s review-shots/web-help.jpg && test -s review-shots/web-help-thumb.jpg
          test -s review-shots/web-help-bottom.jpg && test -s review-shots/web-help-bottom-thumb.jpg
      - name: Visual evidence — Home — first tool rows (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-home-tools.jpg" "batch2-home-tools"
      - name: Visual evidence — Home — further tool rows (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-home-tools-more.jpg" "batch2-home-tools-more"
      - name: Visual evidence — Home — templates (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-home-templates.jpg" "batch2-home-templates"
      - name: Visual evidence — Budget status carousel (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-budget-status.jpg" "batch2-budget-status"
      - name: Visual evidence — Budget category breakdown (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-budget-breakdown.jpg" "batch2-budget-breakdown"
      - name: Visual evidence — Budget help introduction (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-budget-help.jpg" "batch2-budget-help-top"
      - name: Visual evidence — Second account card (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-accounts-second.jpg" "batch2-accounts-second"
      - name: Visual evidence — Report daily line toggle (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-report-line.jpg" "batch2-report-line"
      - name: Visual evidence — Report category allocation (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-allocation.jpg" "batch2-report-allocation"
      - name: Visual evidence — Month Summary destination (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-financial-month.jpg" "batch2-financial-month"
      - name: Visual evidence — Category Breakdown destination (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-financial-category.jpg" "batch2-financial-category"
      - name: Visual evidence — Budget Performance destination (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-financial-budget.jpg" "batch2-financial-budget"
      - name: Visual evidence — Cash Flow Analysis destination (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-financial-cashflow.jpg" "batch2-financial-cashflow"
      - name: Visual evidence — Goal Progress destination (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-financial-goal.jpg" "batch2-financial-goal"
      - name: Visual evidence — Recurring help introduction (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-help.jpg" "batch2-recurring-help"
      - name: Visual evidence — Recurring help continuation (fictional data)
        run: python3 .github/scripts/image_diagnostic.py 0 "review-shots/web-help-bottom.jpg" "batch2-recurring-help-bottom"


  batch3-review:
    name: 'Batch 3 reference: ${{ matrix.group }} (fictional data)'
    # Expose available frames even on a failed journey; missing frames still fail.
    if: ${{ always() && (needs.web.result == 'success' || needs.web.result == 'failure') }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [loans, goals, labels, analytics]
    # Review existing screenshots only. No SDK, Gradle or APK compilation.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Tink-Web-screenshots
          path: review-shots
      - name: Require every Batch 3 frame
        run: python3 .github/scripts/reference_batch_03_evidence.py '${{ matrix.group }}' --verify-only
      - name: Reference frames 1–3
        run: python3 .github/scripts/reference_batch_03_evidence.py '${{ matrix.group }}' 0
      - name: Reference frames 4–6
        run: python3 .github/scripts/reference_batch_03_evidence.py '${{ matrix.group }}' 1
      - name: Reference frames 7–9
        run: python3 .github/scripts/reference_batch_03_evidence.py '${{ matrix.group }}' 2
      - name: Reference frame 10
        run: python3 .github/scripts/reference_batch_03_evidence.py '${{ matrix.group }}' 3


  batch4-review:
    name: 'Batch 4 reference: ${{ matrix.group }} (fictional data)'
    if: ${{ always() && (needs.web.result == 'success' || needs.web.result == 'failure') }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        group: [recurring, catalog, entry, context, health]
    # Screenshot review only: no Flutter/Gradle/native compilation.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Tink-Web-screenshots
          path: review-shots
      - name: Require every Batch 4 frame
        run: python3 .github/scripts/reference_batch_04_evidence.py '${{ matrix.group }}' --verify-only
      - name: Reference frames 1–3
        run: python3 .github/scripts/reference_batch_04_evidence.py '${{ matrix.group }}' 0
      - name: Reference frames 4–6
        run: python3 .github/scripts/reference_batch_04_evidence.py '${{ matrix.group }}' 1
      - name: Reference frames 7–9
        run: python3 .github/scripts/reference_batch_04_evidence.py '${{ matrix.group }}' 2
      - name: Reference frames 10–12
        run: python3 .github/scripts/reference_batch_04_evidence.py '${{ matrix.group }}' 3
      - name: Reference frames 13–15
        run: python3 .github/scripts/reference_batch_04_evidence.py '${{ matrix.group }}' 4


  review-2026:
    name: '2026 workflow evidence (fictional data)'
    if: ${{ always() && (needs.web.result == 'success' || needs.web.result == 'failure') }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Tink-Web-screenshots
          path: review-shots
      - name: Require all 2026 frames and record hashes
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/reference_2026_evidence.py --verify-only
      - name: 2026 frames 1–3
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/reference_2026_evidence.py 0
      - name: 2026 frames 4–6
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/reference_2026_evidence.py 1
      - name: 2026 frames 7–9
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/reference_2026_evidence.py 2
      - name: 2026 frames 10–12
        run: python3 .github/scripts/checked_command.py python3 .github/scripts/reference_2026_evidence.py 3
