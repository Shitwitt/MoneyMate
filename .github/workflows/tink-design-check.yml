name: Tink design verification
on:
  push:
    branches: ['arena/9ea2a134-moneymate']
permissions:
  contents: write
concurrency:
  group: tink-design-verification
  cancel-in-progress: true
jobs:
  design:
    if: contains(github.event.head_commit.message, '[design-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Format this design migration once and retain the resolved lockfile
        run: |
          dart format lib test
          git config user.name 'Tink design check'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'style: format and lock the Tink design migration'
            git push origin HEAD:arena/9ea2a134-moneymate
          fi
      - name: Analyze design migration
        run: python3 .github/scripts/checked_command.py flutter analyze --no-fatal-infos
      - name: Test design migration
        if: always()
        run: python3 .github/scripts/checked_command.py flutter test
