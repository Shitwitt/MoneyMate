name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ['arena/**', 'main']
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/MoneyMate-${GITHUB_SHA::7}-debug.apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-debug-apk
          path: out/*.apk
          retention-days: 30

      # Pushing to a branch in the same repo keeps the APK downloadable
      # from a plain URL (artifact downloads require a GitHub login).
      - name: Publish APK to apk-builds branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="out/MoneyMate-${GITHUB_SHA::7}-debug.apk"
          cp "$APK" out/MoneyMate-latest.apk
          cd out
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apk: ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
          echo "APK URL: https://github.com/${GITHUB_REPOSITORY}/raw/apk-builds/MoneyMate-latest.apk"
