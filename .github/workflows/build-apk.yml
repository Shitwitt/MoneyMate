name: Build MoneyMate Android APK

# Builds an installable, universal Android APK on every push to the default
# branches or a working `arena/*` branch, on pull requests (as a smoke check),
# and on demand from the Actions tab. The APK is always uploaded as an artifact;
# a GitHub Release is only cut from main/master or a manual run, so build
# branches and PRs cannot spam the Releases page.
on:
  push:
    branches: [ "main", "master", "arena/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # The repo ships Dart only, so the native Android folder is generated here
      # with the same org + project name pubspec/imports already use. Whatever
      # the generator emits is hardened by the steps below, which is why it does
      # not matter that `flutter create` loves a plain FlutterActivity.
      - name: Generate Native Android Scaffolding
        run: |
          flutter create . \
            --platforms=android \
            --org dev.hemanths.paisa \
            --project-name moneymate

      # The generator also drops a template smoke test that pumps `MyApp` — a
      # class this app does not have — which would fail the analyzer below.
      - name: Drop Generated Template Test
        run: |
          set -euo pipefail
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          ls test

      # `local_auth` refuses to show a prompt unless (a) the host activity is a
      # FragmentActivity and (b) USE_BIOMETRIC is declared. Both are enforced by
      # a checked-in, idempotent script instead of assuming the generator got it
      # right; it exits non-zero if the scaffold is missing.
      - name: Configure Biometric Auth (FragmentActivity + USE_BIOMETRIC)
        run: python3 tool/android_hardening.py --platform-dir android

      - name: Install Flutter Dependencies
        run: flutter pub get

      # Informational lints (e.g. deprecation notices) must not block the APK,
      # but real analyzer errors still fail the job.
      # Compile errors block the APK. Warnings/infos are printed and mirrored as
      # annotations so they stay visible, but they do not gate the build: a
      # deprecation notice is not a reason to ship no APK.
      #
      # The full report is also posted as a commit comment when there are
      # errors, because Actions job logs are not always retrievable through the
      # API and the terminal output is truncated per step.
      - name: Analyze Dart Sources
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          errors=$(grep -cE "^[[:space:]]*error[[:space:]]+•" analyze.txt)
          warnings=$(grep -cE "^[[:space:]]*warning[[:space:]]+•" analyze.txt)
          infos=$(grep -cE "^[[:space:]]*info[[:space:]]+•" analyze.txt)
          grep -E "^[[:space:]]*(error|warning)[[:space:]]+•" analyze.txt | head -80 |
            while IFS= read -r line; do echo "::error::${line}"; done
          echo "analyzer: ${errors} error(s), ${warnings} warning(s), ${infos} info(s)"
          if [ "$errors" -gt 0 ]; then
            dart analyze lib/screens/debts/debts_screen.dart > focused.txt 2>&1 || true
            echo "=== focused analyze of debts_screen.dart ==="
            cat focused.txt
            cat focused.txt >> analyze.txt
            python3 tool/report_analyzer.py analyze.txt
            echo "::error::flutter analyze reported ${errors} compile error(s)"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::flutter analyze exited ${status} (lint-only findings above)"
          fi
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_COMMENT_URL: ${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.sha }}/comments

      # Bounded on purpose: a widget test that waits on an animation which never
      # settles would otherwise sit there until the job's own time limit.
      - name: Run Test Suite
        timeout-minutes: 20
        run: |
          stack_arg=""
          if flutter test --help 2>&1 | grep -q -- "--concurrency"; then
            stack_arg="--concurrency=1"
          fi
          flutter test $stack_arg --timeout 120s

      - name: Build Release APK (Universal)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK Release
        # Releases only from the shipping branches (or a manual run), never from
        # an arbitrary feature branch.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MoneyMate v1.0.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
