name: Debug APK (Gradle)
on:
  push:
  workflow_dispatch:
    inputs:
      publish_download:
        description: 'Publish a prerelease with a direct installable APK download'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  # New pushes supersede old debug builds instead of stampeding Maven Central.
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    # UI-reference work must not build an APK until explicitly requested.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]') || contains(github.event.head_commit.message, '[debug-download]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve packages and generate translations
        run: |
          python3 .github/scripts/checked_command.py flutter pub get
          flutter gen-l10n
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          printf 'flutter.sdk=%s\nsdk.dir=%s\nflutter.buildMode=debug\nflutter.versionName=%s\nflutter.versionCode=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" "${VERSION%+*}" "${VERSION##*+}" > android/local.properties
      - name: Prepare recommended Android NDK (retry downloads)
        run: python3 .github/scripts/checked_command.py bash .github/scripts/prepare_android.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build debug APK directly with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          python3 ../.github/scripts/checked_command.py python3 ../.github/scripts/retry_build.py ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: Tink-debug-APK
          path: build/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download (explicit opt-in)
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_download) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[debug-download]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp build/app/outputs/apk/debug/app-debug.apk Tink-Android.apk
          sha256sum Tink-Android.apk > Tink-Android.apk.sha256
          gh release create "apk-${GITHUB_RUN_ID}" --target "$GITHUB_SHA" --prerelease \
            --title 'Tink — installable Android APK' \
            --notes 'Install Tink-Android.apk on Android 7/API 24 or newer. Debug-key-signed for sideload testing, not a Play Store release. Export a verified backup before uninstalling an older build to resolve a signing mismatch. See README for privacy, device QA and known limits.' \
            Tink-Android.apk Tink-Android.apk.sha256
