name: Release APK + Web + Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_download:
        description: 'Publish a direct release-mode APK download'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Analyze, test and package source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Check Dart formatting without modifying source
        run: python3 .github/scripts/checked_command.py dart format --output=none --set-exit-if-changed lib test
      - run: python3 .github/scripts/checked_command.py flutter analyze --no-fatal-infos
      - run: python3 .github/scripts/checked_command.py flutter test
      - name: Calendar regressions across a DST boundary
        env:
          TZ: America/New_York
        run: python3 .github/scripts/checked_command.py flutter test test/regression_test.dart
      - name: Package source for download
        run: git archive --format=zip --prefix=PaisaClone/ HEAD -o PaisaClone-source.zip
      - uses: actions/upload-artifact@v5
        with:
          name: PaisaClone-source
          path: PaisaClone-source.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release Android APK
    permissions:
      contents: write
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Prepare recommended Android NDK (retry downloads)
        run: python3 .github/scripts/checked_command.py bash .github/scripts/prepare_android.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo 'No signing secrets: producing an installable DEBUG-KEY-SIGNED release APK. See README before distributing.'
          fi
      - run: python3 .github/scripts/checked_command.py flutter build apk --release
      - uses: actions/upload-artifact@v5
        with:
          name: PaisaClone-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct release APK (explicit opt-in)
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_download) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-download]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PaisaClone-Android-release.apk
          sha256sum PaisaClone-Android-release.apk > PaisaClone-Android-release.apk.sha256
          gh release create "apk-release-${GITHUB_RUN_ID}" --target "$GITHUB_SHA" --prerelease \
            --title 'PaisaClone — optimized installable Android APK' \
            --notes 'Release-mode Android APK for Android 7/API 24 or newer. Uses a debug signing key unless a persistent keystore was configured in Actions secrets. No Internet permission. Back up and verify data before uninstalling an older differently signed build. See README for privacy and real-device QA limits.' \
            PaisaClone-Android-release.apk PaisaClone-Android-release.apk.sha256

  web:
    name: Self-hosted web + real-browser offline smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: python3 .github/scripts/checked_command.py flutter pub get
      - run: flutter gen-l10n
      - name: Web build (self-hosted renderer; no runtime CDN)
        run: |
          python3 .github/scripts/checked_command.py flutter build web --release --no-web-resources-cdn
          python3 scripts/create_web_cache.py
      - name: Install headless browser test tools
        run: npm install --prefix /tmp/paisa-web-smoke playwright-core @sparticuz/chromium
      - name: Browser onboarding, persistence and offline reload
        run: python3 .github/scripts/checked_command.py node .github/scripts/web_smoke.cjs
      - name: Diagnostic screenshot part 1
        if: always()
        run: python3 .github/scripts/image_diagnostic.py 0
      - name: Diagnostic screenshot part 2
        if: always()
        run: python3 .github/scripts/image_diagnostic.py 1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: PaisaClone-Web-screenshots
          path: web-*.jpg
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: PaisaClone-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
